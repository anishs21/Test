on:
 push:
   branches:
     - main


jobs:
 deploy:
   runs-on: ubuntu-latest


   steps:
     # Step 1: Checkout repository
     - name: Checkout code
       uses: actions/checkout@v3


     # Step 2: Setup Node.js (Angular supports Node 18+)
     - name: Setup Node.js
       uses: actions/setup-node@v3
       with:
         node-version: '16'


     # Step 3: Install dependencies and build Angular app
     - name: Build Angular frontend
       run: |
         npm install
        npx ng build


     # Step 4: Copy Angular dist folder to EC2
     - name: Copy Angular dist to EC2
       uses: appleboy/scp-action@master
       with:
         host: ${{ secrets.EC2_HOST }}
         username: ${{ secrets.EC2_USER }}
         key: ${{ secrets.EC2_KEY }}
         source: "docs/"
         target: "/var/www/html/"
         strip_components: 1


     # Step 5: Restart Nginx on EC2
     - name: Restart Nginx
       uses: appleboy/ssh-action@v0.1.6
       with:
         host: ${{ secrets.EC2_HOST }}
         username: ${{ secrets.EC2_USER }}
         key: ${{ secrets.EC2_KEY }}
         script: |
           sudo systemctl restart nginx


